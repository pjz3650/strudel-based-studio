name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: Live-Studio-Windows-x64
          path: |
            release/*setup.exe
            release/*portable.exe
            release/*.blockmap
            playwright-report/
          retention-days: 14
